<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>灯りの向こう側 〜桜色の約束〜</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div id="viewport">
  <div id="stage">
    <!-- 背景レイヤー -->
    <div id="bg-layer">
      <div id="bg-a" class="bg"></div>
      <div id="bg-b" class="bg"></div>
      <div id="bg-tint"></div>
    </div>
    <!-- キャラレイヤー -->
    <div id="chara-layer">
      <div class="chara-slot" id="slot-left"><img class="chara-img back" alt=""><img class="chara-img front" alt=""></div>
      <div class="chara-slot" id="slot-center"><img class="chara-img back" alt=""><img class="chara-img front" alt=""></div>
      <div class="chara-slot" id="slot-right"><img class="chara-img back" alt=""><img class="chara-img front" alt=""></div>
    </div>
    <!-- 演出レイヤー -->
    <canvas id="fx-canvas" width="1280" height="720"></canvas>
    <div id="letterbox-top" class="letterbox"></div>
    <div id="letterbox-bottom" class="letterbox"></div>
    <div id="vignette"></div>
    <div id="flash"></div>
    <div id="fade"></div>

    <!-- ゲームUI -->
    <div id="game-ui" class="hidden">
      <div id="sys-bar">
        <button class="sys-btn" id="btn-save">SAVE</button>
        <button class="sys-btn" id="btn-load">LOAD</button>
        <button class="sys-btn" id="btn-backlog">BACKLOG</button>
        <button class="sys-btn" id="btn-auto">AUTO</button>
        <button class="sys-btn" id="btn-skip">SKIP</button>
        <button class="sys-btn" id="btn-config">CONFIG</button>
        <button class="sys-btn" id="btn-title">TITLE</button>
      </div>
      <div id="chapter-card" class="hidden"><div id="chapter-title"></div><div id="chapter-sub"></div></div>
      <div id="ending-card" class="hidden"><div id="ending-label"></div><div id="ending-title"></div><div id="ending-sub"></div><div id="ending-text"></div><button id="ending-button">タイトルへ戻る</button></div>
      <div id="dialogue-box">
        <div id="name-plate"><span id="name-text"></span></div>
        <div id="dialogue-text"></div>
        <div id="next-indicator">▼</div>
      </div>
      <div id="choice-box" class="hidden"></div>
      <div id="auto-indicator" class="hidden">AUTO ▶</div>
    </div>

    <!-- タイトル画面 -->
    <div id="title-screen">
      <div id="title-logo">
        <div id="title-sub">〜 桜色の約束 〜</div>
        <h1 id="title-main">灯りの向こう側</h1>
        <div id="title-en">BEYOND THE LIGHT</div>
      </div>
      <nav id="title-menu">
        <button class="title-btn" data-act="new">はじめから</button>
        <button class="title-btn" data-act="continue">つづきから</button>
        <button class="title-btn" data-act="gallery">ギャラリー</button>
        <button class="title-btn" data-act="config">設定</button>
      </nav>
      <div id="title-footer">
        <span>© 2026 SAKURA KOBO. All Rights Reserved.</span>
        <span id="title-version">Ver.1.00</span>
      </div>
      <div id="title-hint">ENTER : 決定　/　↑↓ : 選択</div>
    </div>

    <!-- ブート画面 -->
    <div id="boot-screen">
      <div id="boot-logo">桜色工房<span>SAKURA KOBO</span></div>
      <div id="boot-bar"><div id="boot-fill"></div></div>
      <div id="boot-text">NOW LOADING...</div>
    </div>

    <!-- モーダル共通 -->
    <div id="modal" class="hidden">
      <div id="modal-panel">
        <div id="modal-title"></div>
        <div id="modal-body"></div>
        <button id="modal-close">閉じる</button>
      </div>
    </div>
  </div>
</div>
<script src="js/audio.js"></script>
<script src="js/scenario.js"></script>
<script src="js/engine.js"></script>
</body>
</html>

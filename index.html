<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#05070a">
<title>HONSHITSU — 本質 / 偏差値60の教室</title>
<link rel="preload" href="assets/fonts/press-start-2p.woff2" as="font" type="font/woff2" crossorigin>
<link rel="preload" href="assets/fonts/dotgothic16-jp.woff2" as="font" type="font/woff2" crossorigin>
<style>
  /* The page is a viewport for one 16:9 game frame. Nothing else. */
  @font-face {
    font-family: 'Press Start 2P';
    src: url('assets/fonts/press-start-2p.woff2') format('woff2');
    font-display: block;
  }
  @font-face {
    font-family: 'DotGothic16';
    src: url('assets/fonts/dotgothic16-latin.woff2') format('woff2');
    font-display: block;
    unicode-range: U+0000-00FF, U+2000-206F, U+3000-303F, U+FF00-FFEF;
  }
  @font-face {
    font-family: 'DotGothic16 JP';
    src: url('assets/fonts/dotgothic16-jp.woff2') format('woff2');
    font-display: block;
    unicode-range: U+3000-30FF, U+4E00-9FFF, U+FF00-FFEF;
  }
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  html, body {
    margin: 0; padding: 0; width: 100%; height: 100%;
    background: #000; overflow: hidden;
    -webkit-user-select: none; user-select: none;
    -webkit-touch-callout: none;
    overscroll-behavior: none;
    touch-action: none;
    font-family: 'DotGothic16', 'DotGothic16 JP', monospace;
    cursor: none;
  }
  #stage {
    position: fixed; inset: 0;
    display: flex; align-items: center; justify-content: center;
    background: radial-gradient(120% 90% at 50% 40%, #0a0d12 0%, #000 78%);
  }
  /* letterboxed 16:9 frame — scaled from a fixed 1280x720 design space */
  #frame {
    position: relative;
    width: 1280px; height: 720px;
    transform-origin: 50% 50%;
    background: #05070a;
    overflow: hidden;
    box-shadow: 0 0 0 1px #14181f, 0 24px 90px rgba(0,0,0,.9);
    image-rendering: pixelated;
  }
  #frame canvas { display: block; width: 100%; height: 100%; image-rendering: pixelated; }
  #boot {
    position: absolute; inset: 0; background: #05070a; color: #5d6a76;
    display: flex; align-items: center; justify-content: center;
    font-family: 'Press Start 2P', monospace; font-size: 11px; letter-spacing: .18em;
  }
  body::-webkit-scrollbar { display: none; }
</style>
</head>
<body>
  <div id="stage">
    <div id="frame"><div id="boot">HONSHITSU // BOOT</div></div>
  </div>
  <noscript style="color:#889">HONSHITSU requires JavaScript.</noscript>
  <script src="public/vendor/pixi.min.js"></script>
  <script src="public/vendor/howler.min.js"></script>
  <script type="module" src="src/main.js"></script>
  <script>
    // The frame never scrolls, never shows a context menu, and never lets the
    // browser try to scroll/zoom the page under the game.
    addEventListener('contextmenu', (e) => e.preventDefault());
    addEventListener('scroll', () => window.scrollTo(0, 0), { passive: true });
    addEventListener('keydown', (e) => {
      if (['ArrowUp','ArrowDown','ArrowLeft','ArrowRight','Space','Tab','Backspace'].includes(e.code)) e.preventDefault();
      if (e.code === 'Space' && document.activeElement === document.body) e.preventDefault();
    }, { passive: false });
  </script>
</body>
</html>

<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>SHATTERED CROWN</title>
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
    <meta name="color-scheme" content="dark" />
    <meta name="description" content="A dark-fantasy pixel action RPG. Personal, non-commercial project." />
    <style>
      /* The page is a cabinet, not a document: no scroll, no selection, no chrome. */
      :root { color-scheme: dark; }
      html, body {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: #000;
        -webkit-user-select: none;
        user-select: none;
        -webkit-touch-callout: none;
        touch-action: none;
        cursor: none;
        overscroll-behavior: none;
      }
      #stage {
        position: fixed;
        inset: 0;
        display: grid;
        place-items: center;
        background: #000;
      }
      canvas {
        display: block;
        image-rendering: pixelated;
        image-rendering: crisp-edges;
        outline: none;
        box-shadow: 0 0 0 1px #120e0b, 0 24px 80px rgba(0, 0, 0, 0.9);
      }
      /* Shown only if WebGL is unavailable in this browser. */
      #nogl {
        display: none;
        position: fixed;
        inset: 0;
        place-items: center;
        color: #c9a06a;
        font: 16px/1.6 Georgia, "Times New Roman", serif;
        text-align: center;
        padding: 2rem;
      }
    </style>
  </head>
  <body>
    <div id="stage"></div>
    <div id="nogl">This dungeon needs WebGL to render.<br />Please enable hardware acceleration and reload.</div>
    <!-- Engine is vendored (no CDN dependency at runtime). Versions are pinned
         in vendor/ and mirrored in LICENSES.md. -->
    <script src="./vendor/howler.min.js"></script>
    <script type="importmap">
      {
        "imports": {
          "pixi.js": "./vendor/pixi.min.mjs",
          "howler": "./src/vendor-howler.js"
        }
      }
    </script>
    <script type="module" src="./src/main.js"></script>
  </body>
</html>
